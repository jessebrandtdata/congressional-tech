name: Deploy website to Pages

# Archive releases publish independently to R2. Pages deploys only the site,
# whose /archive/ Explorer reads the shared release pointer.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/bill_delay/**"
      - "apps/explorer_mcp/server.json"
      - "apps/explorer_mcp/skills/explore-congress/SKILL.md"
      - ".node-version"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup-python-project/**"
      - ".github/actions/setup-node-project/**"
      - ".github/actions/setup-publication-browser/**"
      - ".github/workflows/deploy-pages.yml"
      - "packages/congress_shared/**"
  # The collector's GITHUB_TOKEN push does not trigger another push workflow.
  workflow_run:
    workflows: ["Update committee data"]
    types: [completed]
    branches: [main]
  # The Bill Delay Tracker reads the spicy-regs warehouse, which publishes a new generation nightly
  # around 04:30 UTC; a daily rebuild keeps its page current.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A completed YouTube report can be committed before a later collection
    # job fails. Build the current main revision, without importing run artifacts.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-node-project
      - name: Verify the archive readers
        working-directory: apps/site
        run: npm run test:explorer
      - name: Verify the Bill Delay Tracker
        run: |
          (cd apps/bill_delay && python -m unittest discover -s tests)
          npm --prefix apps/site run test:bill-delay
      # The tracker's data is built here, not committed: about 85 MB rebuilt from the warehouse in a few
      # minutes, no key. A warehouse outage must not block the rest of the site, so a failed read
      # publishes the page without data (it says so) instead of failing the deploy.
      - name: Build the Bill Delay Tracker data from the spicy-regs warehouse
        continue-on-error: true
        working-directory: apps/bill_delay
        run: |
          python -m bill_delay.collect_warehouse --congress all
          python -m bill_delay.delays
          python -m bill_delay.site_data
      - name: Build Astro site
        working-directory: apps/site
        run: npm run build
      - uses: ./.github/actions/setup-publication-browser
      - name: Require the archive contract against native hand releases
        run: .venv/bin/python -I .github/scripts/verify-archive-contract.py --work "$RUNNER_TEMP/archive-contract"
      - name: Enforce the Pages publication size limit
        run: python .github/scripts/publication-budget.py apps/site/dist --total-limit 1000000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: deployment
        uses: actions/deploy-pages@v4
